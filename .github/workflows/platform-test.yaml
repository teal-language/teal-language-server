name: Test all the OS/Platforms
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lua:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, macos-arm64]
        lua: [lua=5.1, lua=5.4, luajit=@v2.1]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-15-intel
          - os: macos-arm64
            runner: macos-latest

    name: ${{ matrix.os }} (${{ matrix.lua }})
    runs-on: ${{ matrix.runner }}
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v6
      - name: Install libreadline
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libreadline-dev

      - name: Cache Restore
        uses: actions/cache/restore@v5
        with:
          path: |
            lua_install
          key: ${{ matrix.lua }}-${{ matrix.os }}-lua_install

      - name: Install Lua (${{ matrix.lua }})
        run: |
          pip install git+https://github.com/luarocks/hererocks
          hererocks lua_install -r^ --${{ matrix.lua }}
          echo lua_install/bin >> $GITHUB_PATH
        env:
          MACOSX_DEPLOYMENT_TARGET: 11.0

      - name: Build teal-language-server
        run: |
          luarocks make
          luarocks install luacov-coveralls

      - name: Run tests
        run: |
          luarocks test

      - name: Save Cache
        uses: actions/cache/save@v5
        with:
          path: |
            lua_install
          key: ${{ matrix.lua }}-${{ matrix.os }}-lua_install

      # - name: Report test coverage
      #   if: success()
      #   continue-on-error: true
      #   run: luacov-coveralls -e lua_install
      #   env:
      #     COVERALLS_REPO_TOKEN: ${{ github.token }}


  windows:
    strategy:
      fail-fast: false
      matrix:
        lua: [lua=5.4, luajit=@v2.1]
        target: [mingw, vs]
    runs-on: windows-2022
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v6

      # This sets up the environment for compiling C/C++ code from command line.
      # Only needed for the VS target — running it for MinGW puts cl.exe ahead of gcc on
      # PATH and causes cmake to detect the wrong compiler.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target == 'vs'

      - name: Cache Restore
        uses: actions/cache/restore@v5
        with:
          path: |
            lua_install
          key: ${{ matrix.lua }}-${{ matrix.target }}-lua_install

      - name: Install Lua (${{ matrix.lua }})
        run: |
          pip install git+https://github.com/luarocks/hererocks
          hererocks lua_install -r^ --${{ matrix.lua }} --target ${{ matrix.target }}

      # luv's cmake build probes for the v140 (VS2015) toolset when using the Visual
      # Studio MSBuild generator, which doesn't exist on this runner. NMake Makefiles
      # skips that probe and uses cl.exe directly from the PATH set by msvc-dev-cmd.
      - name: Build teal-language-server (VS)
        if: matrix.target == 'vs'
        run: |
          .\lua_install\bin\activate
          luarocks config cmake_generator "NMake Makefiles"
          luarocks make
          luarocks install luacov-coveralls

      # GCC 14 on this runner treats two things as hard errors in C11/C17 mode:
      # - ltreesitter's dynamiclib.c assigns GetLastError() (DWORD) to const char* (-Wint-conversion)
      # - libuv's win/util.c passes const char** where char** is expected (-Wincompatible-pointer-types)
      - name: Build teal-language-server (MinGW)
        if: matrix.target == 'mingw'
        run: |
          .\lua_install\bin\activate
          luarocks config cmake_generator "MinGW Makefiles"
          luarocks make
        env:
          CFLAGS: "-O2 -Wno-int-conversion -Wno-incompatible-pointer-types"

      - name: Save Cache
        uses: actions/cache/save@v5
        with:
          path: |
            lua_install
          key: ${{ matrix.lua }}-${{ matrix.target }}-lua_install

      # luarocks test resolves 'tested' by path without .bat extension, which doesn't
      # exist on Windows — invoke tested.bat directly after installing it explicitly.
      - name: Run tests (VS)
        if: matrix.target == 'vs'
        run: |
          .\lua_install\bin\activate
          luarocks install tested
          luarocks test

      - name: Run tests (MinGW)
        if: matrix.target == 'mingw'
        run: |
          .\lua_install\bin\activate
          luarocks install tested
          luarocks test
        env:
          CFLAGS: "-O2 -Wno-int-conversion"

      # - name: Report test coverage
      #   if: success()
      #   continue-on-error: true
      #   run: |
      #     .\lua_install\bin\activate
      #     luacov-coveralls -e lua_install
      #   env:
      #     COVERALLS_REPO_TOKEN: ${{ github.token }}
